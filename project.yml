name: AnsiView
options:
  bundleIdPrefix: com.traynham
  deploymentTarget:
    macOS: "14.0"
packages:
  AnsiCore:
    path: Packages/AnsiCore
  libwebp:
    url: https://github.com/SDWebImage/libwebp-Xcode
    exactVersion: 1.6.0
settings:
  base:
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "39"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
  configs:
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: 47HEHK53W5
      ENABLE_HARDENED_RUNTIME: YES
      OTHER_CODE_SIGN_FLAGS: --timestamp
      # Notarization rejects the debugging entitlement Xcode injects by default.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      ARCHS: "arm64 x86_64"
      ONLY_ACTIVE_ARCH: NO
targets:
  AnsiView:
    type: application
    platform: macOS
    sources: [App, Shared]
    entitlements:
      path: App/AnsiView.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.application-groups: [47HEHK53W5.com.traynham.ansiview]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AnsiView
        CFBundleIconFile: AppIcon
        NSHumanReadableCopyright: Copyright 2026 Brad Traynham
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.graphics-design
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.traynham.ansiview.ans
            UTTypeDescription: ANSI Art
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [ans, ice, diz, nfo, xb, idf, pcb, avt]
          # .asc has its own type: Quick Look refuses thumbnail extensions that claim .asc
          # ("prohibited filename extension"), so only the thumbnail extension leaves it out.
          - UTTypeIdentifier: com.traynham.ansiview.asc
            UTTypeDescription: ASCII Art
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [asc]
        CFBundleDocumentTypes:
          - CFBundleTypeName: ANSI Art
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [com.traynham.ansiview.ans, com.traynham.ansiview.asc]
          - CFBundleTypeName: Binary Art
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.apple.macbinary-archive, com.amiga.adf-archive]
    dependencies:
      - target: AnsiPreview
      - target: AnsiThumbnail
      - target: AnsiSpotlight
      # Legacy Spotlight importer: macOS 26 does not run the Core Spotlight import extension
      # during indexing (see plan 3 ruling 9), so this is what fills the index.
      - target: AnsiImporter
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Library/Spotlight
      - package: AnsiCore
      - package: libwebp
  AnsiPreview:
    type: app-extension
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.traynham.AnsiView.Preview
    sources: [Preview, Shared]
    dependencies:
      - package: AnsiCore
    entitlements:
      path: Preview/AnsiPreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.application-groups: [47HEHK53W5.com.traynham.ansiview]
    info:
      path: Preview/Info.plist
      properties:
        CFBundleDisplayName: AnsiView Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLIsDataBasedPreview: false
            QLSupportsSearchableItems: false
            QLSupportedContentTypes: [com.traynham.ansiview.ans, com.traynham.ansiview.asc]
  AnsiThumbnail:
    type: app-extension
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.traynham.AnsiView.Thumbnail
    sources: [Thumbnail]
    dependencies:
      - package: AnsiCore
    entitlements:
      path: Thumbnail/AnsiThumbnail.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: Thumbnail/Info.plist
      properties:
        CFBundleDisplayName: AnsiView Thumbnail
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [com.traynham.ansiview.ans]
            QLThumbnailMinimumDimension: 0
  AnsiSpotlight:
    type: app-extension
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.traynham.AnsiView.Spotlight
    sources: [Spotlight]
    dependencies:
      - package: AnsiCore
    entitlements:
      path: Spotlight/AnsiSpotlight.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: Spotlight/Info.plist
      properties:
        CFBundleDisplayName: AnsiView Spotlight
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CSExtensionLabel: AnsiViewImporter
        NSExtension:
          NSExtensionPointIdentifier: com.apple.spotlight.import
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ImportExtension
          NSExtensionAttributes:
            CSSupportedContentTypes: [com.traynham.ansiview.ans, com.traynham.ansiview.asc]
  AnsiImporter:
    type: bundle
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.traynham.AnsiView.Importer
        PRODUCT_NAME: AnsiView
        PRODUCT_MODULE_NAME: AnsiImporter
        WRAPPER_EXTENSION: mdimporter
        SKIP_INSTALL: YES
    sources: [Importer]
    dependencies:
      - package: AnsiCore
    info:
      path: Importer/Info.plist
      properties:
        CFBundleDisplayName: AnsiView Spotlight Importer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDocumentTypes:
          - CFBundleTypeRole: MDImporter
            LSItemContentTypes: [com.traynham.ansiview.ans, com.traynham.ansiview.asc]
        CFPlugInDynamicRegistration: false
        CFPlugInFactories:
          CA227D08-16EB-4DF8-85A9-B12350FDAB21: AnsiViewImporterFactory
        CFPlugInTypes:
          8B08C4BF-415B-11D8-B3F9-0003936726FC: [CA227D08-16EB-4DF8-85A9-B12350FDAB21]
  ansirender:
    type: tool
    platform: macOS
    sources: [Tool, Shared, App/AnsiExport.swift, App/BatchExport.swift, App/ArtCollection.swift]
    dependencies:
      - package: AnsiCore
      - package: libwebp
