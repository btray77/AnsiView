name: AnsiView
options:
  bundleIdPrefix: com.traynham
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
packages:
  AnsiCore:
    path: Packages/AnsiCore
  libwebp:
    url: https://github.com/SDWebImage/libwebp-Xcode
    exactVersion: 1.6.0
  # Updates for the direct download (DMG) build only; see Packaging/appstore for a build without it.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
  # Terminal SSH connections (app target only; the extensions and ansirender do not link it).
  # Apache 2.0. A vendored copy of swift-nio-ssh 0.15.1 with classic BBS algorithms added
  # (Packages/swift-nio-ssh-bbs/PATCHES.md); it brings swift-crypto, swift-atomics and swift-collections.
  swift-nio-ssh:
    path: Packages/swift-nio-ssh-bbs
  swift-nio:
    url: https://github.com/apple/swift-nio
    exactVersion: 2.104.0
settings:
  base:
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "89"
    SWIFT_VERSION: "5.0"
    # Localization (plan 10 item 56): String Catalogs, filled from the compiler's extraction.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
  configs:
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: 47HEHK53W5
      ENABLE_HARDENED_RUNTIME: YES
      OTHER_CODE_SIGN_FLAGS: --timestamp
      # Notarization rejects the debugging entitlement Xcode injects by default.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      ARCHS: "arm64 x86_64"
      ONLY_ACTIVE_ARCH: NO
targets:
  AnsiView:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      # Original sample art from Packaging/samples/generate.swift, copied as a folder.
      - path: Samples
        type: folder
        buildPhase: resources
    settings:
      base:
        # Compiles App/Updates.swift's Sparkle code. The Mac App Store spec leaves it out.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SPARKLE_UPDATES
    entitlements:
      path: App/AnsiView.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.application-groups: [47HEHK53W5.com.traynham.ansiview]
        # Outgoing connections only: File > Browse 16colo.rs (API and downloads), File > Connect
        # to BBS (telnet client) and Sparkle's update checks. The extensions do not get it.
        com.apple.security.network.client: true
        # Dialing directory "Capture on connect": the capture folder the user chose is kept as an
        # app scoped security bookmark so it can be written in later launches (Apple documents this
        # entitlement as required for app scoped bookmarks). Passwords use the login Keychain,
        # which needs no entitlement in the sandbox.
        com.apple.security.files.bookmarks.app-scope: true
        # Sparkle's installer XPC service in a sandboxed app (Sparkle's sandboxing guide).
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    info:
      path: App/Info.plist
      properties:
        # Sparkle. The key is a placeholder until the owner runs generate_keys (see README);
        # with it, updates stay off. No Downloader service: the app has network.client.
        SUFeedURL: https://raw.githubusercontent.com/btray77/AnsiView/main/docs/appcast.xml
        SUPublicEDKey: REPLACE_WITH_SPARKLE_PUBLIC_ED_KEY
        SUEnableInstallerLauncherService: true
        CFBundleDisplayName: AnsiView
        CFBundleIconFile: AppIcon
        NSHumanReadableCopyright: Copyright 2026 Brad Traynham
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.graphics-design
        # AppleScript: render and convert (App/AnsiView.sdef, App/ScriptCommands.swift).
        NSAppleScriptEnabled: true
        OSAScriptingDefinition: AnsiView.sdef
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.traynham.ansiview.ans
            UTTypeDescription: ANSI Art
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [ans, ice, diz, nfo, xb, idf, pcb, avt, rip, bbs]
          # .asc has its own type: Quick Look refuses thumbnail extensions that claim .asc
          # ("prohibited filename extension"), so only the thumbnail extension leaves it out.
          - UTTypeIdentifier: com.traynham.ansiview.asc
            UTTypeDescription: ASCII Art
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [asc]
        CFBundleDocumentTypes:
          - CFBundleTypeName: ANSI Art
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [com.traynham.ansiview.ans, com.traynham.ansiview.asc]
          - CFBundleTypeName: Binary Art
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.apple.macbinary-archive, com.amiga.adf-archive]
          # Images open the image import window (File > Open, Dock drops, Open With).
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image]
    postBuildScripts:
      - name: Sign Sparkle helpers
        path: Packaging/sparkle/sign-sparkle.sh
        basedOnDependencyAnalysis: false
        showEnvVars: false
    dependencies:
      - target: AnsiPreview
      - target: AnsiThumbnail
      - target: AnsiSpotlight
      # Finder Quick Actions (plan 10 item 54): Convert to PNG and Convert to GIF.
      - target: AnsiConvertPNG
      - target: AnsiConvertGIF
      # The screen saver (plan 10 item 48), kept in Resources for File > Install Screen Saver.
      - target: AnsiSaver
        embed: true
        copy:
          destination: resources
      # Legacy Spotlight importer: macOS 26 does not run the Core Spotlight import extension
      # during indexing (see plan 3 ruling 9), so this is what fills the index.
      - target: AnsiImporter
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Library/Spotlight
      - package: AnsiCore
      - package: libwebp
      - package: Sparkle
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIOPosix
      - package: swift-nio
        product: NIOCore
  AnsiPreview:
    type: app-extension
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.traynham.AnsiView.Preview
    sources: [Preview, Shared]
    dependencies:
      - package: AnsiCore
    entitlements:
      path: Preview/AnsiPreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.application-groups: [47HEHK53W5.com.traynham.ansiview]
    info:
      path: Preview/Info.plist
      properties:
        CFBundleDisplayName: AnsiView Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLIsDataBasedPreview: false
            QLSupportsSearchableItems: false
            QLSupportedContentTypes: [com.traynham.ansiview.ans, com.traynham.ansiview.asc]
  AnsiThumbnail:
    type: app-extension
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.traynham.AnsiView.Thumbnail
    sources: [Thumbnail]
    dependencies:
      - package: AnsiCore
    entitlements:
      path: Thumbnail/AnsiThumbnail.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: Thumbnail/Info.plist
      properties:
        CFBundleDisplayName: AnsiView Thumbnail
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [com.traynham.ansiview.ans]
            QLThumbnailMinimumDimension: 0
  AnsiSpotlight:
    type: app-extension
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.traynham.AnsiView.Spotlight
    sources: [Spotlight]
    dependencies:
      - package: AnsiCore
    entitlements:
      path: Spotlight/AnsiSpotlight.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: Spotlight/Info.plist
      properties:
        CFBundleDisplayName: AnsiView Spotlight
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CSExtensionLabel: AnsiViewImporter
        NSExtension:
          NSExtensionPointIdentifier: com.apple.spotlight.import
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ImportExtension
          NSExtensionAttributes:
            CSSupportedContentTypes: [com.traynham.ansiview.ans, com.traynham.ansiview.asc]
  AnsiConvertPNG:
    type: app-extension
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.traynham.AnsiView.ConvertPNG
    sources:
      - path: QuickAction
        excludes: [PNG, GIF]
      # The Quick Action's localizable name (InfoPlist.xcstrings).
      - QuickAction/PNG
      - Shared
      - App/AnsiExport.swift
      - App/ArtActions.swift
    dependencies:
      - package: AnsiCore
      - package: libwebp
    entitlements:
      path: QuickAction/AnsiConvertPNG.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # The files Finder hands the action.
        com.apple.security.files.user-selected.read-only: true
        # The sandbox does not let the action write beside the art, so results go to Downloads
        # (plan 10 ruling 9). No network entitlement.
        com.apple.security.files.downloads.read-write: true
    info:
      path: QuickAction/Info-PNG.plist
      properties:
        CFBundleDisplayName: Convert to PNG
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AnsiViewQuickActionFormat: png
        NSExtension:
          NSExtensionPointIdentifier: com.apple.services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).QuickActionHandler
          NSExtensionAttributes:
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.traynham.ansiview.ans"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.traynham.ansiview.asc"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.apple.macbinary-archive"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.amiga.adf-archive"
              ).@count >= 1).@count >= 1
            NSExtensionServiceAllowsFinderPreviewItem: true
            NSExtensionServiceAllowsTouchBarItem: false
            NSExtensionServiceFinderPreviewIconName: NSActionTemplate
            NSExtensionServiceRoleType: NSExtensionServiceRoleTypeEditor
  AnsiConvertGIF:
    type: app-extension
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.traynham.AnsiView.ConvertGIF
    sources:
      - path: QuickAction
        excludes: [PNG, GIF]
      # The Quick Action's localizable name (InfoPlist.xcstrings).
      - QuickAction/GIF
      - Shared
      - App/AnsiExport.swift
      - App/ArtActions.swift
    dependencies:
      - package: AnsiCore
      - package: libwebp
    entitlements:
      path: QuickAction/AnsiConvertGIF.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # The files Finder hands the action.
        com.apple.security.files.user-selected.read-only: true
        # The sandbox does not let the action write beside the art, so results go to Downloads
        # (plan 10 ruling 9). No network entitlement.
        com.apple.security.files.downloads.read-write: true
    info:
      path: QuickAction/Info-GIF.plist
      properties:
        CFBundleDisplayName: Convert to GIF
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AnsiViewQuickActionFormat: gif
        NSExtension:
          NSExtensionPointIdentifier: com.apple.services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).QuickActionHandler
          NSExtensionAttributes:
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.traynham.ansiview.ans"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.traynham.ansiview.asc"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.apple.macbinary-archive"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.amiga.adf-archive"
              ).@count >= 1).@count >= 1
            NSExtensionServiceAllowsFinderPreviewItem: true
            NSExtensionServiceAllowsTouchBarItem: false
            NSExtensionServiceFinderPreviewIconName: NSActionTemplate
            NSExtensionServiceRoleType: NSExtensionServiceRoleTypeEditor
  AnsiSaver:
    type: bundle
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.traynham.AnsiView.Saver
        PRODUCT_NAME: AnsiView
        PRODUCT_MODULE_NAME: AnsiSaver
        WRAPPER_EXTENSION: saver
        SKIP_INSTALL: YES
    sources:
      - Saver
      # The same original samples the app ships, played when no folder is chosen.
      - path: Samples
        type: folder
        buildPhase: resources
    dependencies:
      - package: AnsiCore
    info:
      path: Saver/Info.plist
      properties:
        CFBundleDisplayName: AnsiView
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPrincipalClass: AnsiSaverView
        NSHumanReadableCopyright: Copyright 2026 Brad Traynham
  AnsiImporter:
    type: bundle
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.traynham.AnsiView.Importer
        PRODUCT_NAME: AnsiView
        PRODUCT_MODULE_NAME: AnsiImporter
        WRAPPER_EXTENSION: mdimporter
        SKIP_INSTALL: YES
    sources: [Importer]
    dependencies:
      - package: AnsiCore
    info:
      path: Importer/Info.plist
      properties:
        CFBundleDisplayName: AnsiView Spotlight Importer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDocumentTypes:
          - CFBundleTypeRole: MDImporter
            LSItemContentTypes: [com.traynham.ansiview.ans, com.traynham.ansiview.asc]
        CFPlugInDynamicRegistration: false
        CFPlugInFactories:
          CA227D08-16EB-4DF8-85A9-B12350FDAB21: AnsiViewImporterFactory
        CFPlugInTypes:
          8B08C4BF-415B-11D8-B3F9-0003936726FC: [CA227D08-16EB-4DF8-85A9-B12350FDAB21]
  ansirender:
    type: tool
    platform: macOS
    sources: [Tool, Shared, App/AnsiExport.swift, App/BatchExport.swift, App/ArtCollection.swift, App/ThumbnailStore.swift, App/Wallpaper.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.traynham.ansirender
        # `ansirender --version` reads this plist from the binary itself.
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
    info:
      path: Tool/Info.plist
      properties:
        CFBundleName: ansirender
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    dependencies:
      - package: AnsiCore
      - package: libwebp
  # iPhone and iPad viewer (plan 8). Reuses AnsiCore; the terminal, editor, transfers, SSH and
  # music are Mac only. Signing is automatic with the team for these targets only.
  AnsiViewiOS:
    type: application
    platform: iOS
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.traynham.AnsiView.iOS
        PRODUCT_NAME: AnsiView
        PRODUCT_MODULE_NAME: AnsiViewMobile
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 47HEHK53W5
        ENABLE_HARDENED_RUNTIME: NO
        OTHER_CODE_SIGN_FLAGS: ""
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
        ARCHS: $(ARCHS_STANDARD)
        ONLY_ACTIVE_ARCH: YES
    sources:
      - iOS/App
      - iOS/Shared
      # The same original samples the Mac app ships.
      - path: Samples
        type: folder
        buildPhase: resources
    dependencies:
      - package: AnsiCore
      - target: AnsiPreviewiOS
      - target: AnsiThumbnailiOS
    info:
      path: iOS/App/Info.plist
      properties:
        CFBundleDisplayName: AnsiView
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: Copyright 2026 Brad Traynham
        LSApplicationCategoryType: public.app-category.graphics-design
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Files copied into the app's Documents folder show in the Files app (On My iPhone >
        # AnsiView); files opened from other apps are read in place, not copied.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.traynham.ansiview.ans
            UTTypeDescription: ANSI Art
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [ans, ice, diz, nfo, xb, idf, pcb, avt, bbs]
          - UTTypeIdentifier: com.traynham.ansiview.asc
            UTTypeDescription: ASCII Art
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [asc]
        CFBundleDocumentTypes:
          - CFBundleTypeName: ANSI Art
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [com.traynham.ansiview.ans, com.traynham.ansiview.asc]
          - CFBundleTypeName: Binary Art
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.apple.macbinary-archive, com.amiga.adf-archive]
          - CFBundleTypeName: Text
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
  # Files app Quick Look preview (plan 8). No entitlements: no network, no app group.
  AnsiPreviewiOS:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.traynham.AnsiView.iOS.Preview
        PRODUCT_NAME: AnsiPreview
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 47HEHK53W5
        ENABLE_HARDENED_RUNTIME: NO
        OTHER_CODE_SIGN_FLAGS: ""
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
        ARCHS: $(ARCHS_STANDARD)
        ONLY_ACTIVE_ARCH: YES
    sources: [iOS/Preview, iOS/Shared]
    dependencies:
      - package: AnsiCore
      # Linked explicitly: the extension host looks up QuickLook's extension context class in the
      # binary, and Swift auto linking alone did not load it (the service failed to start).
      - sdk: QuickLook.framework
    info:
      path: iOS/Preview/Info.plist
      properties:
        CFBundleDisplayName: AnsiView Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLIsDataBasedPreview: false
            QLSupportsSearchableItems: false
            QLSupportedContentTypes: [com.traynham.ansiview.ans, com.traynham.ansiview.asc]
  # Files app thumbnails (plan 8): the Mac's provider source, which is platform neutral. No entitlements.
  AnsiThumbnailiOS:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.traynham.AnsiView.iOS.Thumbnail
        PRODUCT_NAME: AnsiThumbnail
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 47HEHK53W5
        ENABLE_HARDENED_RUNTIME: NO
        OTHER_CODE_SIGN_FLAGS: ""
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
        ARCHS: $(ARCHS_STANDARD)
        ONLY_ACTIVE_ARCH: YES
    sources:
      - path: Thumbnail/ThumbnailProvider.swift
    dependencies:
      - package: AnsiCore
    info:
      path: iOS/Thumbnail/Info.plist
      properties:
        CFBundleDisplayName: AnsiView Thumbnail
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [com.traynham.ansiview.ans]
            QLThumbnailMinimumDimension: 0
